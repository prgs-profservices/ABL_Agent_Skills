    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: pip
    directory: /tooling
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
