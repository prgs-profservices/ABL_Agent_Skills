name: Cisco AI skill scanning

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Cisco skill static scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned Cisco scanner
        run: python -m pip install -r requirements-skill-scanner.txt
      - name: Verify scanner version
        run: skill-scanner --version
      - name: Scan all Git-visible skills statically
        run: python scripts/scan_skills.py --mode static

  scope:
    name: Cisco skill scan scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.scope.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Count Git-visible skills
        id: scope
        shell: bash
        run: echo "count=$(python scripts/scan_skills.py --count-only)" >> "$GITHUB_OUTPUT"

  semantic:
    name: Cisco skill semantic scan
    needs: [static, scope]
    # Skipped without skills, so the Nuclia approval gate only applies when content is sent.
    if: needs.scope.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: skill-scanner-nuclia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Require a trusted scan context
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo 'Fork semantic scanning needs an approved external review path. Failing closed.'
            exit 1
          fi
      - name: Install pinned Cisco scanner
        run: python -m pip install -r requirements-skill-scanner.txt
      - name: Scan with the approved Nuclia gateway
        env:
          SKILL_SCANNER_LLM_MODEL: ${{ vars.SKILL_SCANNER_LLM_MODEL || 'openai/aws-claude-4-6-opus' }}
          SKILL_SCANNER_LLM_BASE_URL: https://aws-us-east-2-1.rag.progress.cloud/api/v1/predict/compat
          SKILL_SCANNER_LLM_API_KEY: ${{ secrets.SKILL_SCANNER_LLM_API_KEY }}
        run: python scripts/scan_skills.py --mode llm
