name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable Git history without publishing secret values
        env:
          SCANNER_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:f4910480cf4d6217b789962c9097f54157d4ae8c59ac85a5dea1252b9c520000
        shell: bash
        run: |
          set -euo pipefail
          results="$(mktemp)"
          diagnostics="$(mktemp)"
          trap 'rm -f "$results" "$diagnostics"' EXIT
          docker pull "$SCANNER_IMAGE"
          status=0
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --entrypoint trufflehog "$SCANNER_IMAGE" \
            git file:///repo --no-update --no-verification \
            --results=verified,unknown,unverified --fail --fail-on-scan-errors \
            --json >"$results" 2>"$diagnostics" || status=$?
          count="$(wc -l < "$results" | tr -d ' ')"
          printf 'TruffleHog findings: %s; scanner exit code: %s\n' "$count" "$status"
          printf 'Scan: %s; commit: %s; findings: %s; exit code: %s\n' \
            "$SCANNER_IMAGE" "$GITHUB_SHA" "$count" "$status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo 'Secret detection or scanner failure. Reproduce privately; raw output is not published.'
            exit "$status"
          fi
