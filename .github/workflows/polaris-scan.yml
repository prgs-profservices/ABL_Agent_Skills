name: Polaris Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polaris-scan:
    name: Polaris SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Require approved scan configuration
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          APPLICATION_NAME: ${{ vars.POLARIS_APPLICATION_NAME }}
          BRIDGE_VERSION: ${{ vars.SECURITY_BRIDGE_CLI_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = "true" ]; then
            echo 'Fork PR scanning requires an approved external integration. Failing closed.'
            exit 1
          fi
          if [ -z "$POLARIS_ACCESS_TOKEN" ] || [ -z "$APPLICATION_NAME" ] || [ -z "$BRIDGE_VERSION" ]; then
            echo 'Configure POLARIS_ACCESS_TOKEN, POLARIS_APPLICATION_NAME and SECURITY_BRIDGE_CLI_VERSION.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive reviewed source
        shell: bash
        run: git archive --format=zip --output="$RUNNER_TEMP/polaris-source.zip" HEAD
      - name: Run Polaris SAST scan
        uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f
        with:
          bridgecli_download_version: ${{ vars.SECURITY_BRIDGE_CLI_VERSION }}
          polaris_server_url: https://polaris.blackduck.com
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_application_name: ${{ vars.POLARIS_APPLICATION_NAME }}
          polaris_project_name: ABL_Agent_Skills
          polaris_assessment_types: SAST
          polaris_assessment_mode: SOURCE_UPLOAD
          polaris_test_sast_type: ${{ github.event_name == 'pull_request' && 'SAST_RAPID' || '' }}
          polaris_branch_parent_name: ${{ github.base_ref }}
          project_directory: .
          project_source_archive: ${{ runner.temp }}/polaris-source.zip
          polaris_test_sast_location: remote
          polaris_waitForScan: 'true'
          mark_build_status: failure
          include_diagnostics: 'false'
          polaris_prComment_enabled: ${{ github.event_name == 'pull_request' }}
          polaris_prComment_severities: critical,high,medium
          github_token: ${{ github.token }}
