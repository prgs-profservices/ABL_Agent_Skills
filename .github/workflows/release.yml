name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated semantic-version tag on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-preview.1."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release tags must point to a commit on main.'
            exit 1
          fi
          type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)"
          if [ "$type" != tag ]; then
            echo 'Use an annotated tag: git tag -a <tag> -m <message>.'
            exit 1
          fi

  skill-scan:
    name: Cisco skill scans
    needs: verify-tag
    uses: ./.github/workflows/skill-scanning.yml
    secrets: inherit

  blackduck-scan:
    name: Black Duck scan
    needs: verify-tag
    uses: ./.github/workflows/blackduck-scan.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      checks: write

  polaris-scan:
    name: Polaris scan
    needs: verify-tag
    uses: ./.github/workflows/polaris-scan.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      checks: write

  publish:
    name: Publish GitHub Release
    needs: [skill-scan, blackduck-scan, polaris-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
