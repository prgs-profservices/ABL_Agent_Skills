name: Black Duck SCA Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blackduck-scan:
    name: Black Duck SCA Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Require approved scan configuration
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_TOKEN }}
          PROJECT_GROUP: ${{ vars.BLACKDUCK_PROJECT_GROUP_NAME }}
          BRIDGE_VERSION: ${{ vars.SECURITY_BRIDGE_CLI_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = "true" ]; then
            echo 'Fork PR scanning requires an approved external integration. Failing closed.'
            exit 1
          fi
          if [ -z "$BLACKDUCK_TOKEN" ] || [ -z "$PROJECT_GROUP" ] || [ -z "$BRIDGE_VERSION" ]; then
            echo 'Configure BLACKDUCK_TOKEN, BLACKDUCK_PROJECT_GROUP_NAME and SECURITY_BRIDGE_CLI_VERSION.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install development dependencies for inventory
        run: python -m pip install -r requirements-dev.txt
      - name: Run Black Duck SCA scan
        uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f
        env:
          DETECT_PROJECT_NAME: ABL_Agent_Skills
          DETECT_PROJECT_GROUP_NAME: ${{ vars.BLACKDUCK_PROJECT_GROUP_NAME }}
          DETECT_PROJECT_VERSION_NAME: main
        with:
          bridgecli_download_version: ${{ vars.SECURITY_BRIDGE_CLI_VERSION }}
          blackducksca_url: https://progresssoftware.app.blackduck.com
          blackducksca_token: ${{ secrets.BLACKDUCK_TOKEN }}
          blackducksca_scan_full: ${{ github.event_name != 'pull_request' }}
          project_directory: .
          blackducksca_scan_failure_severities: BLOCKER,CRITICAL,MAJOR
          detect_search_depth: '10'
          detect_args: >-
            --detect.excluded.directories=.git,.venv,__pycache__
            --detect.accuracy.required=ALL
            --detect.blackduck.scan.mode=${{ github.event_name == 'pull_request' && 'RAPID' || 'INTELLIGENT' }}
            --detect.blackduck.rapid.compare.mode=ALL
          include_diagnostics: 'false'
          mark_build_status: failure
          blackducksca_prComment_enabled: ${{ github.event_name == 'pull_request' }}
          github_token: ${{ github.token }}
